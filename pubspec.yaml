name: venturetech_attendance
description: Face recognition & GPS attendance app for VentureTech Computer Education.
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.11.0
  tflite_flutter: ^0.10.4
  geolocator: ^11.0.0
  cloud_firestore: ^4.15.0
  firebase_core: ^2.27.0
  intl: ^0.19.0
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/mobilefacenet.tflite
